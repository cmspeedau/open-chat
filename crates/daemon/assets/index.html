<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-chat</title>
<link rel="icon" type="image/svg+xml" href="/logo-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="/logo-dark.svg" media="(prefers-color-scheme: dark)">
<style>
/* Design read: local daemon control plane for a developer, aligned with
   OpenChamber's header pattern. Calm, dense, instrument-grade. One accent
   (teal), no gradients, no glass; motion limited to the status pulse and
   suppressed under prefers-reduced-motion. */
:root {
  --bg: #ffffff; --panel: #f6f7f8; --line: #d7dbe0; --text: #1a1d21;
  --muted: #525a64; --accent: #0a6f6a; --accent-ink: #ffffff;
  --ok: #1a7f37; --warn: #9a6700; --err: #b3261e;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1b1f24; --line: #30373e; --text: #e6e9ed;
    --muted: #9aa4b0; --accent: #35b3ab; --accent-ink: #08211f;
    --ok: #57ab5a; --warn: #d4a72c; --err: #e5534b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.55 var(--sans); }

header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  font: 13px var(--mono);
}
.brand { display: flex; align-items: center; gap: 8px; font: 600 15px var(--sans); }
.brand img { width: 20px; height: 20px; display: block; }
.brand img.dark { display: none; }
@media (prefers-color-scheme: dark) {
  .brand img.light { display: none; }
  .brand img.dark { display: block; }
}
.sep { color: var(--line); }
#crumb { color: var(--muted); max-width: 320px; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
#branch { color: var(--muted); }
#branch[hidden] { display: none; }
header button {
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; font: 12.5px var(--mono);
  cursor: pointer; min-height: 32px;
}
header button:hover { border-color: var(--accent); }
header button:focus-visible, a:focus-visible, textarea:focus-visible,
button:focus-visible, summary:focus-visible, [role="menuitem"]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
@media (pointer: coarse) {
  header button, .iconbtn { min-height: 44px; }
}
#conn { margin-left: auto; display: flex; align-items: center; gap: 7px;
        color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.streaming { background: var(--accent); animation: pulse 1.1s infinite; }
.dot.dropped { background: var(--warn); }
.dot.off { background: var(--err); }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot.streaming { animation: none; } }

/* model picker popover: the one elevated surface, because it floats */
#modelMenu {
  position: absolute; top: 46px; right: 60px; z-index: 20; min-width: 220px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 6px; display: none;
  font: 13px var(--mono);
}
#modelMenu.open { display: block; }
#modelMenu button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font: inherit; min-height: 34px;
}
#modelMenu button:hover { background: var(--bg); }
#modelMenu button[aria-current="true"] { color: var(--accent); }
#modelMenu .menustate { color: var(--muted); padding: 8px 10px; }

main { max-width: 980px; margin: 0 auto; padding: 16px 18px 120px; }
#badges {
  display: none; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px;
  font: 12px var(--mono);
}
#badges span {
  border: 1px solid var(--line); background: var(--panel);
  border-radius: 4px; padding: 2px 8px; color: var(--muted);
}
#badges span b { color: var(--text); font-weight: 600; }
.empty {
  color: var(--muted); border: 1px dashed var(--line); border-radius: 6px;
  padding: 26px; text-align: center; margin-top: 30px;
}
.turn { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px;
        background: var(--panel); }
.turn summary {
  display: flex; gap: 10px; align-items: baseline; padding: 10px 14px;
  cursor: pointer; list-style: none;
}
.turn summary::-webkit-details-marker { display: none; }
.turn summary .st { font: 12px var(--mono); color: var(--muted); flex: none; }
.turn summary .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st.ok { color: var(--ok); } .st.fail { color: var(--err); } .st.run { color: var(--accent); }
.turn .body { padding: 0 14px 12px; }
pre.ev {
  font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 0 0 10px;
  white-space: pre-wrap; word-break: break-word;
}
pre.ev .adv { color: var(--warn); }
pre.ev .err { color: var(--err); }
.answer {
  white-space: pre-wrap; margin: 0; padding: 10px 12px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 5px;
  font: 14px/1.55 var(--sans);
}
form#composer {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line); padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
}
form#composer .wrap { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
           clip: rect(0 0 0 0); }
textarea {
  flex: 1; resize: none; rows: 1; min-height: 44px; max-height: 160px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 11px 12px; font: 15px/1.4 var(--sans);
}
#send {
  background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 6px; padding: 0 20px; min-height: 44px;
  font: 600 14px var(--sans); cursor: pointer;
}
#send:disabled { opacity: .55; cursor: not-allowed; }
#note { max-width: 980px; margin: 8px auto 0; font: 12.5px var(--mono);
        color: var(--warn); min-height: 0; }

/* status modal */
#modal { position: fixed; inset: 0; z-index: 40; display: none;
         align-items: center; justify-content: center; padding: 18px;
         background: rgba(0,0,0,.45); }
#modal.open { display: flex; }
.sheet { width: min(560px, 100%); max-height: 80vh; overflow: auto;
         background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
         padding: 18px; }
.sheet h2 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center;
            justify-content: space-between; }
.sheet h2 button { background: none; border: 1px solid var(--line); color: var(--muted);
                   border-radius: 6px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.sheet dl { margin: 12px 0 0; font: 13px var(--mono); }
.sheet dt { color: var(--muted); margin-top: 12px; font-size: 11px;
            text-transform: uppercase; letter-spacing: .4px; }
.sheet dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.sheet dd.none { color: var(--muted); }
.sheet .fine { color: var(--muted); font: 12px var(--mono); margin-top: 14px; }
</style>
</head>
<body>
<header>
  <span class="brand">
    <img class="light" src="/logo-light.svg" alt="" width="20" height="20"
         title="OpenChamber logo (MIT), interim branding - see assets/NOTICE">
    <img class="dark" src="/logo-dark.svg" alt="" width="20" height="20">
    open-chat
  </span>
  <span class="sep" aria-hidden="true">|</span>
  <span id="crumb" title="workspace directory">&#128193; &hellip;</span>
  <span id="branch" hidden></span>
  <button id="modelPill" aria-haspopup="menu" aria-expanded="false">model</button>
  <button id="gear" class="iconbtn" aria-label="Status and settings">&#9881;</button>
  <span id="conn"><span class="dot" id="dot"></span><span id="connText">idle</span></span>
</header>
<nav id="modelMenu" role="menu" aria-label="model picker"><div class="menustate">loading models&hellip;</div></nav>
<main>
  <div id="badges" aria-live="polite"></div>
  <p class="empty" id="empty">No turns yet. Ask the agent to change or check something in this workspace.</p>
  <div id="turns" aria-live="polite"></div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="sheet">
    <h2><span id="mtitle">Status &amp; settings</span>
      <button id="closeModal" aria-label="close dialog">&times;</button></h2>
    <p class="fine" id="modalHint">Live view of the daemon&#39;s real state. Changing the model uses the header pill.</p>
    <dl id="mbody"><dt>loading</dt><dd>reading daemon status&hellip;</dd></dl>
  </div>
</div>
<form id="composer">
  <div class="wrap">
    <label class="sr" for="prompt">Your request</label>
    <textarea id="prompt" aria-label="Your request" placeholder="e.g. add a CLI flag to show the resource budget"></textarea>
    <button id="send" type="submit">Run</button>
  </div>
  <div id="note" role="status"></div>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MAX_TURNS = 30;               // DOM envelope cap (older turns dropped)
let running = false;

window.addEventListener("error", (e) => note("script error: " + e.message));
window.addEventListener("unhandledrejection", (e) =>
  note("async error: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

function conn(state, text) {
  $("dot").className = "dot " + state;
  $("connText").textContent = text;
}
function note(msg) { $("note").textContent = msg || ""; }
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- header: real data from /status ---------- */
async function refreshHeader() {
  try {
    const doc = await (await fetch("/status")).json();
    const cwd = doc.cwd || "";
    $("crumb").textContent = "\u{1F4C2} " + (cwd || "workspace");
    $("crumb").title = cwd || "unknown workspace";
    if (doc.git_branch) {
      $("branch").hidden = false;
      $("branch").textContent = "\u2387 " + doc.git_branch;
    } else { $("branch").hidden = true; }
    $("modelPill").textContent = doc.llm_model || "model";
    return doc;
  } catch (e) {
    $("crumb").textContent = "\u{1F4C2} unreachable";
    return null;
  }
}

/* ---------- model picker (populates from GET /models) ---------- */
let menuBuilt = false;
function closeMenu() {
  $("modelMenu").classList.remove("open");
  $("modelPill").setAttribute("aria-expanded", "false");
}
$("modelPill").addEventListener("click", async () => {
  const open = $("modelMenu").classList.toggle("open");
  $("modelPill").setAttribute("aria-expanded", String(open));
  if (!open || menuBuilt) return;
  const menu = $("modelMenu");
  try {
    const res = await fetch("/models");
    const doc = await res.json();
    menu.replaceChildren();
    if (!res.ok) {
      const d = document.createElement("div");
      d.className = "menustate";
      d.textContent = "provider: " + (doc.error || res.status);
      menu.appendChild(d);
      return;
    }
    const current = $("modelPill").textContent;
    for (const id of doc.models) {
      const b = document.createElement("button");
      b.setAttribute("role", "menuitem");
      b.type = "button";
      b.textContent = id;
      if (id === current) b.setAttribute("aria-current", "true");
      b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          const r = await fetch("/model", { method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ model: id }) });
          if (!r.ok) throw new Error((await r.json()).error || r.status);
          $("modelPill").textContent = id;
          note("model switched to " + id + " (until daemon restart)");
        } catch (err) {
          note("model switch failed: " + err.message);
        }
        b.disabled = false;
        closeMenu();
      });
      menu.appendChild(b);
    }
    menuBuilt = true;
  } catch (err) {
    menu.replaceChildren();
    const d = document.createElement("div");
    d.className = "menustate";
    d.textContent = "could not load models: " + err.message;
    menu.appendChild(d);
  }
});
document.addEventListener("click", (e) => {
  if (!$("modelMenu").contains(e.target) && e.target !== $("modelPill")) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); closeModal(); }
});

/* ---------- status modal (populates from GET /status) ---------- */
function openModal(doc) {
  const m = $("modal");
  const dl = $("mbody");
  dl.replaceChildren();
  const add = (term, def, cls) => {
    dl.appendChild(Object.assign(document.createElement("dt"), { textContent: term }));
    dl.appendChild(Object.assign(document.createElement("dd"),
      { textContent: def, className: cls || "" }));
  };
  if (!doc) { add("daemon", "unreachable", "none"); }
  else {
    add("provider", (doc.llm_model || "?") + " @ " + "configured base_url");
    add("model override", doc.model_override
      ? "active - resets on daemon restart" : "none - using config default",
      doc.model_override ? "" : "none");
    add("workspace", doc.cwd || "?");
    add("git branch", doc.git_branch || "not a repo / git unavailable",
      doc.git_branch ? "" : "none");
    add("version", doc.version || "?");
    add("governor", (doc.governor?.cores ?? "?") + "/" + (doc.governor?.usable_total ?? "?") +
      " cores, " + (doc.governor?.free_build_slots ?? "?") + " build slot(s)");
    add("verify", doc.verifier
      ? doc.verifier + " before each turn close" : "not configured",
      doc.verifier ? "" : "none");
    if ((doc.checks_skipped || []).length)
      add("skipped checks", doc.checks_skipped.join(", "));
    add("stack", doc.stack || "none", doc.stack ? "" : "none");
    add("skills", (doc.active_skills || []).length ? doc.active_skills.join(", ") : "none",
      (doc.active_skills || []).length ? "" : "none");
    if ((doc.skill_gaps || []).length) add("gaps", doc.skill_gaps.join(", ") +
      " (fill via the daemon: skills --bootstrap <lang>)");
    add("memory", (doc.memory_entries ?? "?") + " entries", doc.memory_entries ? "" : "none");
  }
  m.classList.add("open");
  $("closeModal").focus();
}
function closeModal() {
  const m = $("modal");
  if (!m.classList.contains("open")) return;
  m.classList.remove("open");
  $("gear").focus();
}
$("gear").addEventListener("click", async () => openModal(await refreshHeader()));
$("closeModal").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

/* ---------- turn rendering (collapsed envelopes + live SSE) ---------- */
function elTurn(prompt) {
  const d = document.createElement("details");
  d.className = "turn";
  d.open = true;
  d.innerHTML =
    '<summary><span class="st run">running</span><span class="q"></span></summary>' +
    '<div class="body"><pre class="ev"></pre><p class="answer" hidden></p></div>';
  d.querySelector(".q").textContent = prompt;
  const host = $("turns");
  host.appendChild(d);
  $("empty").hidden = true;
  while (host.children.length > MAX_TURNS) {
    host.removeChild(host.firstChild);
    note("older turns dropped from view (daemon keeps the full log)");
  }
  return d;
}
function addEvent(turn, cls, text) {
  const pre = turn.querySelector(".ev");
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text + "\n";
  pre.appendChild(span);
}
function finishTurn(turn, closed, badges) {
  const st = turn.querySelector(".st");
  st.textContent = closed ? "closed" : "failed";
  st.className = "st " + (closed ? "ok" : "fail");
  turn.open = false;
  if (badges) renderBadges(badges);
}
function renderBadges(b) {
  const bar = $("badges");
  bar.style.display = "flex";
  const skills = (b.skills || []).map(s => `${s.id} ${s.tokens}t${s.capped ? "*" : ""}`).join(", ") || "none";
  const surf = (b.armed_surfaces || []).join(", ") || "none";
  const checks = (b.checks_run || []).join(", ") || "none";
  const skipped = (b.checks_skipped || []).length ? `, skipped ${(b.checks_skipped || []).join("/")}` : "";
  bar.innerHTML =
    `<span>stack <b>${esc(b.stack || "none")}</b></span>` +
    `<span>skills <b>${esc(skills)}</b></span>` +
    `<span>surfaces <b>${esc(surf)}</b></span>` +
    `<span>prompt <b>${b.prompt_tokens}t</b></span>` +
    `<span>cpu <b>${b.cores}/${b.usable_cores}</b> slots <b>${b.free_build_slots}</b></span>` +
    `<span>verify <b>${esc(checks)}</b>${esc(skipped)}</span>` +
    `<span>filler <b>${b.slop_stripped_bytes}B</b> prose <b>${b.prose_findings ?? 0}</b> faults <b>${b.memory_faults ?? 0}</b></span>`;
}

function makeSseParser(onEvent) {
  let buf = "";
  return (chunk) => {
    buf += chunk;
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of frame.split("\n")) {
        if (line.startsWith("data: ")) {
          try { onEvent(JSON.parse(line.slice(6))); } catch (e) { /* skip */ }
        }
      }
    }
  };
}

async function runTurn(prompt, key, turn, seen) {
  const res = await fetch("/chat", {
    method: "POST",
    headers: { "x-idempotency-key": key },
    body: prompt,
  });
  if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
  const parse = makeSseParser((ev) => handleEvent(ev));
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    parse(dec.decode(value, { stream: true }));
  }

  function handleEvent(ev) {
    // Replay dedup: retries resend the turn buffer from the start.
    if (seen.count < seen.max_skip) { seen.count++; return; }
    seen.count++;
    switch (ev.type) {
      case "iteration":
        addEvent(turn, null, `· iteration ${ev.index} (${ev.total_tokens}t prompt)`);
        break;
      case "tool_called":
        addEvent(turn, ev.ok ? null : "err", `· ${ev.ok ? "✓" : "✗"} ${ev.name}: ${ev.digest}`);
        break;
      case "final_verification":
        addEvent(turn, ev.ok ? null : "err", `· verification ${ev.ok ? "green" : "RED"}`);
        break;
      case "slop_stripped":
        addEvent(turn, "adv", `· filler stripped: ${ev.bytes}B`);
        break;
      case "memory_fault":
        addEvent(turn, "err", `· memory diagnostic [${ev.fault}] ${ev.headline}`);
        break;
      case "surface_armed":
        addEvent(turn, "adv", `· ${ev.surface} surface bound (${ev.reason})`);
        break;
      case "prose_gate":
        for (const f of ev.findings) addEvent(turn, "adv", `· prose: ${f}`);
        break;
      case "assistant_text":
        break; // full answer arrives on turn_closed
      case "turn_closed": {
        const a = turn.querySelector(".answer");
        a.hidden = false;
        a.textContent = ev.text;
        seen.closed = true;
        finishTurn(turn, true, ev.badges);
        break;
      }
      case "turn_failed":
        addEvent(turn, "err", `· failed: ${ev.error}`);
        seen.closed = true;
        finishTurn(turn, false, null);
        break;
    }
  }
}

async function send(prompt) {
  running = true;
  $("send").disabled = true;
  const turn = elTurn(prompt);
  const key = "w-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  const seen = { count: 0, max_skip: 0, closed: false };
  let delay = 1000;
  conn("streaming", "streaming");
  note("");
  for (;;) {
    try {
      await runTurn(prompt, key, turn, seen);
      if (seen.closed) break;
      throw new Error("stream ended before turn closed");
    } catch (err) {
      if (seen.closed) break;
      conn("dropped", "reconnecting");
      note(`stream dropped (${err.message}); retrying in ${delay / 1000}s - same idempotency key, replay-safe`);
      await new Promise((r) => setTimeout(r, delay));
      seen.max_skip = seen.count;
      delay = Math.min(delay * 2, 15000);
    }
  }
  conn("", "idle");
  note("");
  running = false;
  $("send").disabled = false;
  $("prompt").focus();
}

function doSend() {
  if (running) return;
  const v = $("prompt").value.trim();
  if (!v) return;
  $("prompt").value = "";
  send(v);
}
$("composer").addEventListener("submit", (e) => { e.preventDefault(); doSend(); });
$("send").addEventListener("click", (e) => { e.preventDefault(); doSend(); });
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
$("prompt").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
});
conn("", "idle");
// Deep link: ?prompt=... prefills the composer (never auto-submits).
try {
  const qp = new URLSearchParams(location.search).get("prompt");
  if (qp) $("prompt").value = qp.slice(0, 4000);
} catch (e) { /* URL API always present; belt and braces */ }
refreshHeader();
</script>
</body>
</html>

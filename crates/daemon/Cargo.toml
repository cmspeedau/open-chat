[package]
name = "openchat-daemon"
description = "Headless open-chat core daemon: resource-governed agent runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "openchatd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs = "6"
openchat-governor.workspace = true
openchat-memory.workspace = true
openchat-session.workspace = true
openchat-skills.workspace = true
openchat-telegram.workspace = true
openchat-tools.workspace = true
openchat-watcher.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile = "3"
